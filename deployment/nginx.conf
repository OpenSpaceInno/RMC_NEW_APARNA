# NGINX Reverse Proxy Configuration for Aparna RMC Plant PL01
# Location: /etc/nginx/sites-available/rmc-gate.conf

# Upstream Node.js Backend Server
upstream rmc_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Upstream MediaMTX HLS Live Camera Video Server
upstream mediamtx_hls {
    server 127.0.0.1:8888;
}

# Port 80 HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name rmc.aparna-plant01.internal 192.168.0.200;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rmc.aparna-plant01.internal 192.168.0.200;

    # SSL TLS Certificates
    ssl_certificate /etc/ssl/certs/aparna_rmc_plant.crt;
    ssl_certificate_key /etc/ssl/private/aparna_rmc_plant.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single Page App Build Root (Vite dist)
    root /opt/rmc-gate-system/dist;
    index index.html;

    # Static Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets Long-Term Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API Endpoints Proxying
    location /api/ {
        proxy_pass http://rmc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M; # Accommodates high-resolution 3K ANPR camera evidence uploads
    }

    # Zero-Latency Weighbridge Scale WebSocket Stream
    location /scale {
        proxy_pass http://rmc_backend/scale;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s; # Keeps scale WebSocket streaming connection alive across entire 24h shift
        proxy_send_timeout 86400s;
    }

    # MediaMTX HLS Live Video Feeds
    location /hls/ {
        proxy_pass http://mediamtx_hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
}

